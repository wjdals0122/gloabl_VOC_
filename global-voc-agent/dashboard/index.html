<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LG 글로벌 VOC 랩 | Global VOC Intelligence</title>
  <meta name="description" content="LG 해외 고객 리뷰(VOC) 출처 탐색, 선별 및 수집 대시보드">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌐</text></svg>">
</head>
<body>

  <!-- ==========================================================================
       1. 상단 헤더 (브랜드 로고플레이 + 2대 메뉴 + 데모 On/Off 토글 + 다크모드 On/Off)
       ========================================================================== -->
  <header class="site-header" role="banner">
    <div class="header-inner">
      <!-- 브랜드 로고 및 아이덴티티 (첨부한 로고 이미지 직접 반영) -->
      <a class="brand-logo-wrap" onclick="App.navigateToTab('tab-sources')" title="메인 화면으로 이동" aria-label="LG 글로벌 VOC 랩">
        <img src="images/lg-voc-lab-header-logo.png" alt="LG 글로벌 VOC 랩 | 해외 고객 반응을 수집·분석하는 AI Agent" class="brand-logo-img">
      </a>

      <!-- 2개 주요 메뉴 (VOC 탐색 / 수집 결과) -->
      <nav class="header-center-nav" role="navigation" aria-label="주요 메뉴">
        <div class="nav-tab-pill">
          <button type="button" class="nav-tab-btn active" id="nav-btn-sources" data-tab="tab-sources">
            VOC 탐색
          </button>
          <button type="button" class="nav-tab-btn" id="nav-btn-results" data-tab="tab-results">
            수집 결과
          </button>
        </div>
      </nav>

      <!-- 우측 컨트롤 영역: 데모 안내 + 데모 배지 + 설정 버튼 -->
      <div class="header-right">
        <span class="header-demo-notice" id="header-demo-notice">* 데모 데이터로 체험 중입니다.</span>

        <!-- 소형 데모 상태 배지 및 토글 -->
        <button type="button" class="btn-demo-badge active" id="btn-toggle-demo" title="클릭하여 데모 모드를 켜거나 끌 수 있습니다.">
          <span class="demo-badge-dot"></span>
          <span id="demo-toggle-label">데모 모드</span>
        </button>

        <!-- 설정 모달 버튼 (다크모드 및 버전 포함) -->
        <button type="button" class="btn btn-secondary btn-sm" id="btn-open-settings" title="환경 설정, 테마 및 엔드포인트 관리">
          ⚙️ 설정
        </button>
      </div>
    </div>
  </header>

  <!-- 콘텐츠 상단 데모 모드 간결한 안내 -->
  <aside id="content-demo-banner" class="content-info-banner" role="status">
    <span>💡 <strong>데모 데이터로 체험 중입니다.</strong></span>
  </aside>

  <!-- ==========================================================================
       2. 메인 애플리케이션 화면
       ========================================================================== -->
  <main class="app-container" role="main">

    <!-- ----------------------------------------------------------------------
         화면 1: 출처 탐색 및 선택
         ---------------------------------------------------------------------- -->
    <section class="tab-view-section active" id="tab-sources" aria-labelledby="nav-btn-sources">
      <!-- 메인 안내 문구 및 타이핑 헤더 -->
      <div class="search-hero-header">
        <h2 class="search-hero-title">
          <span class="sr-only">세계 곳곳의 고객 목소리를 찾아보세요.</span>
          <span class="typing-text-display" aria-hidden="true"></span><span class="typing-cursor" aria-hidden="true"></span>
        </h2>
        <p class="search-hero-subtitle">국가와 제품을 입력하고, 원하는 출처를 선택해 VOC를 수집하세요.</p>
      </div>

      <!-- 국가·제품 입력 영역 (Light Card) -->
      <div class="search-control-card">
        <div class="search-form-row">
          <div class="form-group-country">
            <label class="form-label" for="input-country">대상 국가</label>
            <select id="input-country" class="input-select">
              <option value="US">미국 (US)</option>
              <option value="JP">일본 (JP)</option>
              <option value="DE">독일 (DE)</option>
              <option value="PL">폴란드 (PL)</option>
              <option value="UK">영국 (UK)</option>
              <option value="FR">프랑스 (FR)</option>
              <option value="KR">대한민국 (KR)</option>
            </select>
          </div>

          <div class="form-group-product">
            <label class="form-label" for="input-product">제품명</label>
            <input type="text" id="input-product" class="input-text" placeholder="조사할 제품명을 입력하세요 (예: LG OLED evo G4)" value="LG OLED evo G4">
          </div>

          <div class="form-group-action">
            <button type="button" class="btn btn-primary btn-search" id="btn-discover-sources">
              출처 찾기
            </button>
          </div>
        </div>
      </div>

      <!-- 출처 목록 테이블 영역 (SourceView 동적 렌더링) -->
      <div id="view-sources-content">
        <!-- JS SourceView 렌더링 -->
      </div>
    </section>

    <!-- ----------------------------------------------------------------------
         화면 2: 수집 및 결과
         ---------------------------------------------------------------------- -->
    <section class="tab-view-section" id="tab-results" aria-labelledby="nav-btn-results">
      <!-- 수집 컨트롤러 및 결과 렌더링 (ResultsView 동적 렌더링) -->
      <div id="view-results-content">
        <!-- JS ResultsView 렌더링 -->
      </div>
    </section>

  </main>

  <!-- ==========================================================================
       3. 푸터
       ========================================================================== -->
  <footer class="site-footer" role="contentinfo">
    <p>Global VOC Collector &bull; 다국가 고객 리뷰(VOC) 출처 선택형 수집 인텔리전스</p>
  </footer>

  <!-- ==========================================================================
       4. 스크립트 로드
       ========================================================================== -->
  <script src="js/config.js"></script>
  <script src="js/mock_data.js"></script>
  <script src="js/csv_exporter.js"></script>
  <script src="js/api.js"></script>
  <script src="js/views/source_view.js"></script>
  <script src="js/views/results_view.js"></script>
  <script src="js/views/settings_modal.js"></script>
  <script src="js/views/api_docs_view.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
