<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LG 글로벌 VOC 랩 | Global VOC Intelligence</title>
  <meta name="description" content="LG 해외 고객 리뷰(VOC) 소셜 리스닝 및 인텔리전스 대시보드">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌐</text></svg>">
  <!-- Chart.js CDN: 인터랙티브 시계열 라인 차트 및 긍부정 도넛 차트 렌더링 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <!-- ==========================================================================
       1. 상단 헤더 (브랜드 로고플레이 + 2대 메뉴 + 데모 On/Off 토글 + 다크모드 On/Off)
       ========================================================================== -->
  <header class="site-header" role="banner">
    <div class="header-inner">
      <!-- 브랜드 로고 및 아이덴티티 (첨부한 로고 이미지 직접 반영) -->
      <a class="brand-logo-wrap" onclick="App.navigateToTab('tab-sources')" title="메인 화면으로 이동" aria-label="LG 글로벌 VOC 랩">
        <img src="images/lg-voc-lab-header-logo.png" alt="LG 글로벌 VOC 랩 | 해외 고객 반응을 수집·분석하는 AI Agent" class="brand-logo-img">
      </a>

      <!-- 주요 메뉴: 2개 기본 파이프라인 탭(Pill)과 명확히 구분된 독립형 정기 리포트 예약 탭 -->
      <nav class="header-center-nav" role="navigation" aria-label="주요 메뉴">
        <!-- 1. 기본 수집 파이프라인 (2단계 묶음) -->
        <div class="nav-tab-pill">
          <button type="button" class="nav-tab-btn active" id="nav-btn-sources" data-tab="tab-sources">
            VOC 탐색
          </button>
          <button type="button" class="nav-tab-btn" id="nav-btn-results" data-tab="tab-results">
            수집 결과
          </button>
        </div>

        <!-- 2. 시각적 구분자 (두 탭과 묶이지 않도록 명확히 분리) -->
        <div class="nav-tab-divider" aria-hidden="true"></div>

        <!-- 3. 구분된 독립 탭: 정기 리포트 예약 -->
        <button type="button" class="nav-tab-standalone" id="nav-btn-scheduled" data-tab="tab-scheduled" title="원하는 주기(매주 월요일 09시 등)로 VOC를 자동 수집하여 이메일로 받아보는 기능">
          <span class="tab-icon">⏰</span>
          <span>정기 리포트 예약</span>
          <span class="scheduled-badge" id="nav-scheduled-badge">2</span>
        </button>
      </nav>

      <!-- 우측 컨트롤 영역: 설정 버튼 -->
      <div class="header-right">
        <!-- 설정 모달 버튼 (다크모드 및 버전 포함) -->
        <button type="button" class="btn btn-secondary btn-sm" id="btn-open-settings" title="환경 설정, 테마 및 엔드포인트 관리">
          ⚙️ 설정
        </button>
      </div>
    </div>
  </header>

  <!-- 콘텐츠 상단 데모 모드 간결한 안내 -->
  <aside id="content-demo-banner" class="content-info-banner" role="status">
    <span>💡 <strong>데모 데이터로 체험 중입니다.</strong></span>
  </aside>

  <!-- ==========================================================================
       2. 메인 애플리케이션 화면
       ========================================================================== -->
  <main class="app-container" role="main">

    <!-- ----------------------------------------------------------------------
         화면 1: VOC 탐색 (출처 선택 삭제, 기간 선택, 수집 채널 선택 3가지)
         ---------------------------------------------------------------------- -->
    <section class="tab-view-section active" id="tab-sources" aria-labelledby="nav-btn-sources">
      <!-- 메인 안내 문구 및 타이핑 헤더 -->
      <div class="search-hero-header">
        <h2 class="search-hero-title">
          <span class="sr-only">세계 곳곳의 고객 목소리를 찾아보세요.</span>
          <span class="typing-text-display" aria-hidden="true"></span><span class="typing-cursor" aria-hidden="true"></span>
        </h2>
        <p class="search-hero-subtitle">국가와 키워드를 입력하고, 기간 및 수집 채널을 선택해 VOC를 수집하세요.</p>
      </div>

      <!-- 국가·키워드·기간·수집채널 입력 영역 (Light Card) -->
      <div class="search-control-card">
        <!-- 상단 행: 대상 국가, 키워드, 수집 시작 버튼 -->
        <div class="search-form-row">
          <div class="form-group-country">
            <label class="form-label" for="input-country">대상 국가</label>
            <select id="input-country" class="input-select">
              <option value="US" selected>미국 (US)</option>
              <option value="KR">대한민국 (KR)</option>
              <option value="JP">일본 (JP)</option>
              <option value="DE">독일 (DE)</option>
              <option value="PL">폴란드 (PL)</option>
              <option value="UK">영국 (UK)</option>
              <option value="FR">프랑스 (FR)</option>
            </select>
          </div>

          <div class="form-group-product">
            <label class="form-label" for="input-product">키워드</label>
            <input type="text" id="input-product" class="input-text" placeholder="조사할 키워드를 입력하세요 (예: LG 워시콤보, LG OLED evo G4)" value="LG 워시콤보">
          </div>

          <div class="form-group-action">
            <button type="button" class="btn btn-primary btn-search" id="btn-discover-sources">
              🔍 VOC 수집 및 분석 시작
            </button>
          </div>
        </div>

        <!-- 하단 행: 기간 선택 & 수집 채널 선택 (3가지 옵션) -->
        <div class="search-filter-subrow">
          <!-- 기간 선택 -->
          <div class="filter-subgroup">
            <label class="filter-subgroup-label" for="select-period">
              <span class="filter-icon">📅</span> 기간 선택
            </label>
            <div class="period-select-wrap">
              <select id="select-period" class="input-select select-compact">
                <option value="7d">최근 7일</option>
                <option value="1m" selected>최근 1개월</option>
                <option value="3m">최근 3개월</option>
                <option value="6m">최근 6개월</option>
                <option value="1y">최근 1년</option>
              </select>
            </div>
          </div>

          <!-- 수집 채널 선택 (3가지 중 선택 가능) -->
          <div class="filter-subgroup">
            <label class="filter-subgroup-label" for="select-channel">
              <span class="filter-icon">📡</span> 수집 채널 선택
            </label>
            <div class="channel-select-wrap">
              <select id="select-channel" class="input-select select-compact">
                <option value="all" selected>&gt; 커뮤니티 + 제품리뷰 (통합)</option>
                <option value="community">&gt; 커뮤니티 (Reddit, 포럼, 카페)</option>
                <option value="reviews">&gt; 제품리뷰 (가전몰, 전문리뷰)</option>
              </select>
            </div>
          </div>

          <!-- 제외 키워드 입력 -->
          <div class="filter-subgroup">
            <label class="filter-subgroup-label" for="input-explore-exclude">
              <span class="filter-icon">🚫</span> 제외 키워드
            </label>
            <div class="exclude-input-wrap">
              <input type="text" id="input-explore-exclude" class="input-text select-compact input-exclude-field" placeholder="쉼표 구분 (예: 광고, 배송)">
            </div>
          </div>

          <!-- 신속 가이드 안내 -->
          <div class="search-quick-meta">
            <span class="meta-dot">●</span> 실시간 AI 감성 분석 및 채널별 키워드 리포트 생성
          </div>
        </div>
      </div>

      <!-- VOC 탐색 하단 가이드 뷰 (SourceView 동적 렌더링) -->
      <div id="view-sources-content">
        <!-- JS SourceView 렌더링 -->
      </div>
    </section>

    <!-- ----------------------------------------------------------------------
         화면 2: 수집 및 결과
         ---------------------------------------------------------------------- -->
    <section class="tab-view-section" id="tab-results" aria-labelledby="nav-btn-results">
      <!-- 수집 컨트롤러 및 결과 렌더링 (ResultsView 동적 렌더링) -->
      <div id="view-results-content">
        <!-- JS ResultsView 렌더링 -->
      </div>
    </section>

    <!-- ----------------------------------------------------------------------
         화면 3: 정기 리포트 예약 및 발송 내역 (독립 탭)
         ---------------------------------------------------------------------- -->
    <section class="tab-view-section" id="tab-scheduled" aria-labelledby="nav-btn-scheduled">
      <!-- 정기 예약 관리 뷰 (ScheduledReportsView 동적 렌더링) -->
      <div id="view-scheduled-content">
        <!-- JS ScheduledReportsView 렌더링 -->
      </div>
    </section>

  </main>

  <!-- ==========================================================================
       3. 푸터
       ========================================================================== -->
  <footer class="site-footer" role="contentinfo">
    <p>Global VOC Collector &bull; 다국가 고객 리뷰(VOC) 출처 선택형 수집 인텔리전스</p>
  </footer>

  <!-- ==========================================================================
       4. 스크립트 로드
       ========================================================================== -->
  <script src="js/config.js"></script>
  <script src="js/mock_data.js"></script>
  <script src="js/csv_exporter.js"></script>
  <script src="js/api.js"></script>
  <script src="js/views/source_view.js"></script>
  <script src="js/views/results_view.js"></script>
  <script src="js/views/scheduled_reports_view.js"></script>
  <script src="js/views/settings_modal.js"></script>
  <script src="js/views/api_docs_view.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
