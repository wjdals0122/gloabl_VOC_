<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global VOC Collector | 글로벌 고객 피드백 인텔리전스</title>
  <meta name="description" content="글로벌 고객 리뷰(VOC) 출처 탐색, 선별 및 수집 대시보드">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌐</text></svg>">
</head>
<body>

  <!-- ==========================================================================
       1. 상단 헤더 (브랜드 로고플레이 + 2대 메뉴 + 데모 On/Off 토글 + 다크모드 On/Off)
       ========================================================================== -->
  <header class="site-header" role="banner">
    <div class="header-inner">
      <!-- 브랜드 로고 및 아이덴티티 -->
      <a class="brand-logo-wrap" onclick="App.navigateToTab('tab-sources')" title="메인 화면으로 이동">
        <div class="brand-icon-box" aria-hidden="true">
          <svg class="brand-svg" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="16" cy="16" r="13" stroke="currentColor" stroke-width="2" stroke-opacity="0.3"/>
            <ellipse cx="16" cy="16" rx="6.5" ry="13" stroke="currentColor" stroke-width="1.8" stroke-opacity="0.4"/>
            <line x1="3" y1="16" x2="29" y2="16" stroke="currentColor" stroke-width="1.8" stroke-opacity="0.4"/>
            <circle cx="16" cy="16" r="3.5" fill="currentColor"/>
            <circle cx="23" cy="10" r="2" fill="currentColor" fill-opacity="0.8"/>
            <circle cx="9" cy="22" r="2" fill="currentColor" fill-opacity="0.8"/>
          </svg>
        </div>
        <div class="brand-text-group">
          <div class="brand-main-title">
            <span class="brand-text-prefix">Global</span>
            <span class="brand-text-highlight">VOC</span>
            <span class="brand-text-suffix">Collector</span>
            <span class="brand-version-chip">v1.2</span>
          </div>
          <span class="brand-subtext">글로벌 고객 피드백 인텔리전스</span>
        </div>
      </a>

      <!-- 2개 주요 메뉴 -->
      <nav class="header-center-nav" role="navigation" aria-label="주요 메뉴">
        <button type="button" class="nav-tab-btn active" id="nav-btn-sources" data-tab="tab-sources">
          출처 탐색 및 선택
        </button>
        <button type="button" class="nav-tab-btn" id="nav-btn-results" data-tab="tab-results">
          수집 및 결과
        </button>
      </nav>

      <!-- 우측 컨트롤 영역: 데모모드 On/Off 토글 + 라이트/다크 토글 + 설정 -->
      <div class="header-right">
        <!-- 인터랙티브 데모 모드 On/Off 토글 버튼 -->
        <button type="button" class="btn-demo-toggle active" id="btn-toggle-demo" title="클릭하여 데모 모드를 켜거나 끌 수 있습니다.">
          <span class="demo-icon">🧪</span>
          <span id="demo-toggle-label">데모 모드 ON</span>
        </button>

        <!-- 라이트 / 다크 모드 On/Off 스위처 -->
        <button type="button" class="btn-theme-toggle" id="btn-toggle-theme" title="라이트/다크 모드 전환">
          <span id="theme-toggle-icon">🌙</span>
          <span id="theme-toggle-label">다크모드</span>
        </button>

        <!-- 설정 모달 버튼 -->
        <button type="button" class="btn btn-secondary btn-sm" id="btn-open-settings" title="환경 설정 및 엔드포인트 관리">
          ⚙️ 설정
        </button>
      </div>
    </div>
  </header>

  <!-- 콘텐츠 상단 데모 모드 간결한 한 줄 안내 -->
  <aside id="content-demo-banner" class="content-info-banner" role="status">
    <span>💡 데모 모드입니다. 가상 데이터로 출처 탐색 및 수집 흐름을 테스트할 수 있습니다. 상단 <strong>[데모 모드 ON]</strong> 버튼을 눌러 언제든 실제 모드로 전환할 수 있습니다.</span>
  </aside>

  <!-- ==========================================================================
       2. 메인 애플리케이션 화면
       ========================================================================== -->
  <main class="app-container" role="main">

    <!-- ----------------------------------------------------------------------
         화면 1: 출처 탐색 및 선택
         ---------------------------------------------------------------------- -->
    <section class="tab-view-section active" id="tab-sources" aria-labelledby="nav-btn-sources">
      <!-- 국가·제품 입력 영역 (Elevated Hero Card + Blue Top Accent) -->
      <div class="search-control-card">
        <div class="search-form-row">
          <div class="form-group-country">
            <label class="form-label" for="input-country">대상 국가</label>
            <select id="input-country" class="input-select">
              <option value="US">미국 (US)</option>
              <option value="JP">일본 (JP)</option>
              <option value="DE">독일 (DE)</option>
              <option value="PL">폴란드 (PL)</option>
              <option value="UK">영국 (UK)</option>
              <option value="FR">프랑스 (FR)</option>
              <option value="KR">대한민국 (KR)</option>
            </select>
          </div>

          <div class="form-group-product">
            <label class="form-label" for="input-product">제품명</label>
            <input type="text" id="input-product" class="input-text" placeholder="조사할 제품명을 입력하세요 (예: LG OLED evo G4)" value="LG OLED evo G4">
          </div>

          <div class="form-group-action">
            <button type="button" class="btn btn-outline btn-search" id="btn-discover-sources" title="후보 출처를 먼저 탐색하고 원하는 사이트만 선택합니다">
              출처 찾기 (2단계)
            </button>
            <button type="button" class="btn btn-instant" id="btn-instant-collect" title="n8n Webhook(collect-global-voc)을 호출하여 탐색 및 스크래핑을 즉시 일괄 실행합니다">
              ⚡ n8n 일괄 즉시 수집
            </button>
          </div>
        </div>
        <div class="search-form-footer">
          <span class="webhook-badge-info">⚡ 일괄 수집 대상 Webhook: <code id="label-instant-webhook">http://localhost:5678/webhook-test/collect-global-voc</code> (우측 상단 ⚙️ 설정에서 변경 가능)</span>
        </div>
      </div>

      <!-- 출처 목록 테이블 영역 (SourceView 동적 렌더링) -->
      <div id="view-sources-content">
        <!-- JS SourceView 렌더링 -->
      </div>
    </section>

    <!-- ----------------------------------------------------------------------
         화면 2: 수집 및 결과
         ---------------------------------------------------------------------- -->
    <section class="tab-view-section" id="tab-results" aria-labelledby="nav-btn-results">
      <!-- 수집 컨트롤러 및 결과 렌더링 (ResultsView 동적 렌더링) -->
      <div id="view-results-content">
        <!-- JS ResultsView 렌더링 -->
      </div>
    </section>

  </main>

  <!-- ==========================================================================
       3. 푸터
       ========================================================================== -->
  <footer class="site-footer" role="contentinfo">
    <p>Global VOC Collector &bull; 다국가 고객 리뷰(VOC) 출처 선택형 수집 인텔리전스</p>
  </footer>

  <!-- ==========================================================================
       4. 스크립트 로드
       ========================================================================== -->
  <script src="js/config.js"></script>
  <script src="js/mock_data.js"></script>
  <script src="js/csv_exporter.js"></script>
  <script src="js/api.js"></script>
  <script src="js/views/source_view.js"></script>
  <script src="js/views/results_view.js"></script>
  <script src="js/views/settings_modal.js"></script>
  <script src="js/views/api_docs_view.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
