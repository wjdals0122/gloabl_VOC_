<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global VoC Lab</title>
<style>
  :root{
    --bg:#f3f4f7; --card:#ffffff; --line:#e7e8ee; --line-soft:#f0f1f5;
    --ink:#1d1f2b; --ink-2:#4a4e5e; --ink-3:#7c8092;
    --brand:#4b2ff0; --brand-soft:#eeebff;
    --pos:#2f9e63; --pos-soft:#bfe8cf; --neu:#7cc0d0; --neu-soft:#cdeef6; --neg:#6a4fd6; --neg-soft:#e3dcff;
    --warn:#e0663f; --warn-soft:#fde8e1;
    --radius:22px; --shadow:0 1px 2px rgba(20,22,40,.04),0 6px 24px rgba(20,22,40,.04);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:15px}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input,select,textarea{font:inherit;color:inherit}
  .app{display:grid;grid-template-columns:76px 1fr;min-height:100vh}

  /* ---------- rail ---------- */
  .rail{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:18px 0;gap:6px;position:sticky;top:0;height:100vh;z-index:5}
  .logo{width:48px;height:48px;border-radius:14px;background:var(--brand);display:grid;place-items:center;margin-bottom:18px;cursor:pointer}
  .rail .nav{width:100%;display:flex;flex-direction:column;gap:4px}
  .rail .nav button{height:56px;display:grid;place-items:center;color:#5b5f73;position:relative}
  .rail .nav button.on{background:var(--brand-soft);color:var(--brand)}
  .rail .nav button:hover{color:var(--brand)}
  .rail .spacer{flex:1}
  .rail svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tip{position:absolute;left:70px;background:var(--ink);color:#fff;font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:.15s}
  .rail .nav button:hover .tip{opacity:1}

  /* ---------- common ---------- */
  .wrap{padding:28px 36px 48px;min-width:0}
  .topbar{display:flex;align-items:center;gap:14px;margin-bottom:24px;flex-wrap:wrap}
  .topbar h1{font-size:20px;font-weight:600;margin:0 auto 0 0;letter-spacing:-.01em}
  .topbar h1 small{font-weight:400;color:var(--ink-3);font-size:14px;margin-left:8px}
  .pill{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px}
  .pill select,.pill input{border:0;outline:0;background:transparent}
  .pill input{width:150px}
  .btn{background:var(--brand);color:#fff;border-radius:999px;padding:10px 18px;font-weight:600;font-size:14px;display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
  .btn:hover{filter:brightness(1.08)}
  .btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
  .btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--line)}
  .btn.sm{padding:7px 14px;font-size:13px}
  .demo{font-size:12px;color:var(--brand);background:var(--brand-soft);border-radius:6px;padding:3px 8px;font-weight:600}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line-soft);min-width:0}
  .pad{padding:26px 30px}
  h2{font-size:26px;font-weight:500;letter-spacing:-.01em;margin:0}
  h3{font-size:18px;font-weight:600;margin:0}
  .sub{color:var(--ink-2);font-size:14px;margin-top:4px}
  .muted{color:var(--ink-3)}
  .grid{display:grid;gap:24px;min-width:0}
  .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
  .row-between{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .POSITIVE{color:var(--pos)} .NEGATIVE{color:var(--neg)} .NEUTRAL{color:#3d8fa3}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:12px;padding:3px 9px;border-radius:999px;background:#f1f2f6;color:var(--ink-2);white-space:nowrap}
  .chip.p{background:#e6f6ec;color:var(--pos)} .chip.n{background:var(--neg-soft);color:var(--neg)} .chip.w{background:var(--warn-soft);color:var(--warn)} .chip.b{background:var(--brand-soft);color:var(--brand)}
  .empty{padding:30px;text-align:center;color:var(--ink-3)}
  .arrows{display:flex;gap:18px}
  .arrows button{font-size:20px;color:var(--ink-3);padding:2px 6px}
  .arrows button:hover{color:var(--brand)}
  .tabs{display:flex;gap:6px;background:#f2f3f7;border-radius:999px;padding:4px;width:max-content}
  .tabs button{padding:6px 14px;border-radius:999px;font-size:13px;color:var(--ink-2)}
  .tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
  .stat .n{font-size:30px;font-weight:500;letter-spacing:-.02em;margin-top:10px}
  .stat .d{font-size:13px;margin-top:6px}
  .up{color:var(--warn)} .down{color:var(--pos)}
  .field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2)}
  .field input,.field select{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--ink);background:#fff;outline:0}
  .field input:focus,.field select:focus{border-color:var(--brand)}
  .switch{position:relative;width:40px;height:22px;flex:none;display:inline-block}
  .switch input{opacity:0;width:0;height:0}
  .switch span{position:absolute;inset:0;background:#d6d8e1;border-radius:999px;transition:.15s;cursor:pointer}
  .switch span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .switch input:checked+span{background:var(--brand)}
  .switch input:checked+span:before{transform:translateX(18px)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-weight:500;color:var(--ink-3);font-size:13px;padding:12px;border-bottom:1px solid var(--line);white-space:nowrap}
  th.sort{cursor:pointer} th.sort:hover{color:var(--brand)}
  td{padding:13px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top}
  tbody tr{cursor:pointer} tbody tr:hover td{background:#fafafe}
  .clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
  pre.json{background:#171a2b;color:#d7dcff;border-radius:14px;padding:16px 18px;font-size:12.5px;line-height:1.55;overflow:auto;margin:0;max-height:360px}
  .legend{display:flex;gap:16px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend i{width:10px;height:10px;border-radius:50%;display:inline-block}

  /* ---------- dashboard ---------- */
  .dash{display:grid;grid-template-columns:360px 1fr 1fr;gap:24px;align-items:start}
  .sources{grid-row:1/4}
  .sources .head{display:flex;align-items:center;justify-content:space-between;padding:26px 30px 8px}
  .add{color:var(--brand);font-weight:600;display:flex;gap:6px;align-items:center;font-size:15px}
  .add i{width:18px;height:18px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-style:normal;font-size:14px;line-height:1}
  .total{display:flex;justify-content:space-between;align-items:center;margin:8px 16px 6px;padding:14px 14px 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:17px}
  .tree{padding:6px 16px 10px}
  .trow{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:10px;font-size:15px}
  .trow.g1{font-size:17px;margin-top:10px;cursor:pointer}
  .trow.leaf{color:var(--ink-2);padding-left:38px;cursor:pointer}
  .trow.leaf:hover{background:#f6f6fb}
  .trow.leaf.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
  .caret{display:inline-block;margin-right:8px;font-size:10px;color:var(--ink-2);transition:transform .15s}
  .trow.collapsed .caret{transform:rotate(-90deg)}
  .status{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:8px;vertical-align:middle}
  .ok{background:var(--pos)} .blocked{background:var(--warn)}
  .boxlink{margin:12px 16px 22px;border:1px solid var(--line);border-radius:16px;padding:16px 22px}
  .boxlink b{font-weight:500;font-size:16px;display:block;margin-bottom:6px}
  .boxlink a{color:var(--brand);text-decoration:none;font-size:15px}
  .plan{grid-column:2/4;display:grid;grid-template-columns:1.25fr 1fr;gap:10px;padding:26px 30px 30px}
  .plan .left{display:grid;grid-template-columns:auto 1fr;column-gap:36px}
  .plan .left .title{grid-column:1/-1;margin-bottom:12px}
  .donut-wrap{display:flex;flex-direction:column;align-items:center;gap:18px;padding-left:40px}
  .vlegend{display:flex;flex-direction:column;gap:8px;font-size:15px;color:var(--ink-2)}
  .vlegend span{display:flex;align-items:center;gap:10px}
  .vlegend i{width:16px;height:16px;border-radius:50%;display:inline-block}
  .big{align-self:center}
  .big .n{font-size:38px;font-weight:500;letter-spacing:-.02em}
  .big .l{font-size:17px;color:var(--ink-2);margin-top:6px}
  .big .s{font-size:14px;color:var(--ink-2);margin-top:12px}
  .watch-head{display:flex;justify-content:space-between;align-items:center;margin:6px 0 22px}
  .watch-head .t{font-size:17px;color:var(--ink-2)}
  .watch{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .wcard{border:1px solid var(--line);border-radius:14px;padding:14px 16px 12px}
  .wcard .k{display:flex;align-items:center;gap:8px;font-size:15px}
  .wcard .k em{font-style:normal;font-size:11px;padding:2px 6px;border-radius:5px;background:var(--warn-soft);color:var(--warn);font-weight:600}
  .wcard .v{margin:12px 0 8px 14px;font-size:15px}
  .bar{height:30px;margin:0 0 0 14px;border-radius:6px;background:var(--neu-soft);overflow:hidden}
  .bar>div{height:100%;background:var(--neu);border-radius:6px 0 0 6px}
  .wcard .o{text-align:right;font-size:13px;color:var(--ink-2);margin-top:6px}
  .recent{grid-column:2;overflow:hidden}
  .recent .hd{background:#f2f5fd;padding:24px 30px 20px}
  .recent .hd h2 b{font-weight:500}
  .list{padding:4px 20px 14px}
  .item{display:grid;grid-template-columns:1fr auto;gap:2px 16px;padding:14px 10px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}
  .item:last-of-type{border-bottom:0}
  .item:hover{background:#fafafe}
  .item .t{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .c{color:var(--ink-2);font-size:14px}
  .item .r{text-align:right;font-size:15px;font-weight:500}
  .item .d{text-align:right;color:var(--ink-2);font-size:14px}
  .bills{grid-column:3;padding:26px 30px 24px}
  .bgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .bcard{border:1px solid var(--line);border-radius:14px;padding:12px 14px 16px;cursor:pointer}
  .bcard:hover{border-color:#cfd2df}
  .bcard .top{display:flex;align-items:center;gap:10px;font-size:14px;padding-bottom:10px;border-bottom:1px solid var(--line-soft)}
  .badge{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;flex:none}
  .bcard .top .dots{margin-left:auto;color:var(--ink-3);font-size:18px;line-height:1}
  .bcard .nm{font-size:17px;margin:14px 0 6px}
  .bcard .val{font-size:19px;font-weight:600}
  .seeall{margin-top:16px;display:block;width:100%;background:#f2f4f9;border-radius:10px;padding:12px;color:var(--brand);font-weight:600;font-size:15px;text-align:center}
  .brands{grid-column:2;padding:26px 30px 28px}
  .bchart{display:grid;grid-template-columns:150px 1fr;gap:22px;align-items:center;margin-top:18px}
  .brow{display:grid;grid-template-columns:72px 1fr 40px;gap:10px;align-items:center;font-size:14px;margin:10px 0}
  .track{height:12px;background:#f0f1f6;border-radius:999px;overflow:hidden;display:flex}
  .track i{display:block;height:100%}
  .brow .cnt{text-align:right;color:var(--ink-2)}
  .brow.lg .nm{font-weight:700;color:var(--brand)}
  .kw{grid-column:3;padding:26px 30px 28px}
  .kwlist{margin-top:18px;display:flex;flex-direction:column;gap:12px}
  .kwrow{display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:center;font-size:15px}
  .kwrow .rk{color:var(--ink-3);font-weight:600}
  .mini{height:6px;border-radius:999px;background:#eef0f5;margin-top:6px;overflow:hidden}
  .mini i{display:block;height:100%}

  /* ---------- discover ---------- */
  .steps{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--ink-3);margin-top:16px}
  .steps b{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;background:#e9eaf0;color:var(--ink-3);font-size:12px;margin-right:6px}
  .steps .on{color:var(--ink);font-weight:600} .steps .on b{background:var(--brand);color:#fff}
  .steps .done b{background:var(--pos);color:#fff}
  .steps .sep{width:28px;height:1px;background:var(--line)}
  .src{display:grid;grid-template-columns:24px 1fr auto;gap:14px;align-items:start;padding:16px 4px;border-bottom:1px solid var(--line-soft);cursor:pointer}
  .src:last-child{border-bottom:0}
  .src input{width:18px;height:18px;accent-color:var(--brand);margin-top:3px}
  .src .nm{font-size:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .src .u{font-size:13px;color:var(--ink-3);margin-top:3px;word-break:break-all}
  .src .ds{font-size:14px;color:var(--ink-2);margin-top:6px}
  .state{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .state span{font-size:13px;padding:6px 12px;border-radius:999px;background:#f1f2f6;color:var(--ink-3)}
  .state span.on{background:var(--brand);color:#fff}
  .state span.fail{background:var(--warn);color:#fff}
  .resrow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 0;border-bottom:1px solid var(--line-soft)}

  /* ---------- results ---------- */
  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .filters select,.filters input{border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;background:#fff;outline:0}
  .filters input{width:220px}
  .pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:16px;font-size:14px;color:var(--ink-2)}
  .pager button{border:1px solid var(--line);border-radius:8px;padding:6px 12px;background:#fff}
  .pager button:disabled{opacity:.4;cursor:default}

  /* ---------- monitor ---------- */
  .mrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:14px;align-items:center;padding:14px 10px;border-bottom:1px solid var(--line-soft);cursor:pointer;border-radius:10px}
  .mrow:hover{background:#fafafe}
  .mrow.on{background:var(--brand-soft)}
  .alert{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line-soft);font-size:14px}
  .dot{width:10px;height:10px;border-radius:50%;margin-top:5px}
  .mail{border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:14px}
  .mail .mh{background:#f7f7fb;padding:12px 16px;border-bottom:1px solid var(--line);color:var(--ink-2);line-height:1.7}
  .mail .mb{padding:16px;line-height:1.7}

  /* ---------- heatmap ---------- */
  .heat{display:grid;gap:4px;font-size:13px}
  .heat .c{border-radius:6px;height:38px;display:grid;place-items:center;font-weight:600}
  .heat .h{color:var(--ink-3);text-align:center;font-size:12px;align-self:end;padding-bottom:4px}
  .heat .r{display:flex;align-items:center;font-weight:500}

  /* ---------- video ---------- */
  .vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .vcard{border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;background:#fff}
  .vcard:hover{border-color:#cfd2df}
  .vcard.on{outline:2px solid var(--brand)}
  .thumb{aspect-ratio:16/9;position:relative;display:grid;place-items:center}
  .thumb .play{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center}
  .thumb .dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.75);color:#fff;font-size:12px;padding:2px 6px;border-radius:4px}
  .vcard .vb{padding:12px 14px 14px}
  .vcard .vt{font-size:15px;line-height:1.4}
  .tl{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:14px;line-height:1.5}
  .tl .ts{color:var(--brand);font-family:ui-monospace,Menlo,monospace;font-size:13px;padding-top:1px}
  .urlbox{flex:1;border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-size:14px;outline:0}
  .urlbox:focus{border-color:var(--brand)}

  /* ---------- drawer / modal / toast ---------- */
  .scrim{position:fixed;inset:0;background:rgba(20,22,40,.25);opacity:0;pointer-events:none;transition:.2s;z-index:10}
  .scrim.on{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:460px;max-width:92vw;background:#fff;box-shadow:-10px 0 40px rgba(0,0,0,.12);transform:translateX(100%);transition:.25s;padding:28px 30px;overflow:auto;z-index:11}
  .drawer.on{transform:none}
  .x{position:absolute;right:20px;top:20px;font-size:22px;color:var(--ink-3)}
  .kv{display:grid;grid-template-columns:110px 1fr;gap:10px 14px;font-size:14px;margin-top:18px}
  .kv dt{color:var(--ink-3)} .kv dd{margin:0}
  .quote{background:#f7f7fb;border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.6;color:var(--ink-2);margin-top:18px}
  .modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%);width:520px;max-width:92vw;background:#fff;border-radius:20px;padding:28px 30px;box-shadow:0 20px 60px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:.2s;z-index:11}
  .modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1d1f2b;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.2);transition:.2s;z-index:20;opacity:0;pointer-events:none;max-width:80vw}

  @media (max-width:1280px){
    .dash{grid-template-columns:1fr 1fr}
    .sources{grid-row:auto;grid-column:1/-1}
    .plan{grid-column:1/-1;grid-template-columns:1fr}
    .recent,.brands{grid-column:1} .bills,.kw{grid-column:2}
    .g4{grid-template-columns:1fr 1fr} .vgrid{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="logo" onclick="go('dashboard')">
      <svg viewBox="0 0 24 24" style="stroke:#fff;stroke-width:2.6"><circle cx="11" cy="11" r="6.5"/><path d="M15.5 15.5 20 20"/></svg>
    </div>
    <nav class="nav">
      <button data-v="dashboard"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M10 10v10"/></svg><span class="tip">대시보드</span></button>
      <button data-v="discover"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="tip">출처 탐색</span></button>
      <button data-v="results"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="tip">수집 결과</span></button>
      <button data-v="monitor"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span class="tip">정기 모니터링</span></button>
      <button data-v="sentiment"><svg viewBox="0 0 24 24"><path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg><span class="tip">감성 분석</span></button>
      <button data-v="trend"><svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 4 8-8"/><path d="M14 8h6v6"/></svg><span class="tip">추이</span></button>
      <button data-v="video"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2"/><path d="m10 9.5 4.5 2.5-4.5 2.5z"/></svg><span class="tip">영상 VoC</span></button>

function donut(parts, size, width){
  const r = 15.915; let off = 25;
  return `<svg width="${size}" height="${size}" viewBox="0 0 42 42">` + parts.map(p => {
    const s = `<circle cx="21" cy="21" r="${r}" fill="none" stroke="${p.color}" stroke-width="${width}" stroke-dasharray="${p.v*100} ${100-p.v*100}" stroke-dashoffset="${off}"><title>${esc(p.label)} ${(p.v*100).toFixed(1)}%</title></circle>`;
    off -= p.v * 100; return s;
  }).join('') + '</svg>';
}
function lineChart(series, labels, { h = 260, unit = '', max } = {}){
  const W = 900, H = h, L = 44, Rp = 16, T = 16, B = 30;
  const all = series.flatMap(s => s.data);
  const niceTop = m => { const raw = m * 1.1 / 4, mag = 10 ** Math.floor(Math.log10(raw)); const step = [1,1.5,2,2.5,3,4,5,6,8,10].find(k => k * mag >= raw) * mag; return step * 4; };
  const top = max ?? niceTop(Math.max(...all, 1));
  const x = i => L + (W - L - Rp) * (labels.length === 1 ? .5 : i / (labels.length - 1));
  const y = v => T + (H - T - B) * (1 - v / top);
  const lab = v => unit === '%' ? Math.round(v * 100) + '%' : fmt(Math.round(v));
  let g = '';
  for (let k = 0; k <= 4; k++){ const v = top * k / 4, yy = y(v); g += `<line x1="${L}" x2="${W-Rp}" y1="${yy}" y2="${yy}" stroke="#eef0f5"/><text x="${L-8}" y="${yy+4}" text-anchor="end" font-size="11" fill="#7c8092">${lab(v)}</text>`; }
  labels.forEach((l, i) => g += `<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="#7c8092">${l}</text>`);
  const lines = series.map(s => {
    const pts = s.data.map((v, i) => `${x(i)},${y(v)}`).join(' ');
    const area = s.area ? `<polygon points="${x(0)},${y(0)} ${pts} ${x(s.data.length-1)},${y(0)}" fill="${s.color}" opacity=".08"/>` : '';
    const dots = s.data.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="#fff" stroke="${s.color}" stroke-width="2"><title>${esc(s.name)} · ${labels[i]} · ${lab(v)}</title></circle>`).join('');
    return area + `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>` + dots;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${g}${lines}</svg>`;
}

const stackBar = parts => `<span class="track">${parts.map(([v,c,t]) => `<i style="width:${v*100}%;background:${c}" title="${esc(t)} ${(v*100).toFixed(0)}%"></i>`).join('')}</span>`;

function csvDownload(rows, cols, name){

  const body = [cols.join(','), ...rows.map(r => cols.map(c => q(Array.isArray(r[c]) ? r[c].join('|') : r[c])).join(','))].join('\n');

}

function discoverRun(){

function collectRun(){

function filteredVoc(){
  const f = ST.res, q = f.q.trim().toLowerCase();
  return VOC.filter(v => (!f.ch || v.source_site === f.ch) && (!f.br || v.target_brand === f.br) && (!f.se || v.ai_sentiment === f.se) && (!f.it || v.user_intent === f.it) && (!q || (v.kr_summary + ' ' + v.content).toLowerCase().includes(q)))
    .sort((a,b) => String(a[f.sort]).localeCompare(String(b[f.sort])) * f.dir);
}
function renderTable(){
  const rows = filteredVoc(), PER = 15, pages = Math.max(1, Math.ceil(rows.length / PER));

  $('#tbody').innerHTML = pg.length ? pg.map(v => `<tr onclick="vocDrawer('${v.voc_id}')">
    <td class="muted" style="white-space:nowrap">${v.published_at}</td><td style="white-space:nowrap">${esc(v.source_site)}</td><td>${esc(v.target_brand)}</td><td class="mono muted">${esc(v.model_code)}</td>

    <td><div class="chips">${v.positive_keywords.map(k => `<span class="chip p">${esc(k)}</span>`).join('')}${v.negative_keywords.map(k => `<span class="chip n">${esc(k)}</span>`).join('')}</div></td>
    <td class="${v.ai_sentiment}" style="font-weight:500;white-space:nowrap">${SENT[v.ai_sentiment]}</td><td style="white-space:nowrap">${INTENT[v.user_intent]}</td></tr>`).join('')
    : `<tr><td colspan="8" class="empty">조건에 맞는 VoC가 없습니다</td></tr>`;
  $('#pager').innerHTML = `<span>${fmt(rows.length)}건 중 ${rows.length ? ST.res.page*PER+1 : 0}–${ST.res.page*PER+pg.length}</span><button ${ST.res.page ? '' : 'disabled'} onclick="ST.res.page--;renderTable()">이전</button><button ${ST.res.page < pages-1 ? '' : 'disabled'} onclick="ST.res.page++;renderTable()">다음</button>`;
}
function sortBy(k){ ST.res.dir = ST.res.sort === k ? -ST.res.dir : -1; ST.res.sort = k; go('results'); }
function exportResults(){ csvDownload(filteredVoc(), ['voc_id','country','source_site','category','content_type','published_at','target_brand','product_line','model_code','ai_sentiment','user_intent','kr_summary','positive_keywords','negative_keywords','content'], 'global_voc_insights.csv'); }

  kw:{ '건조 시간':[9,10,10,11,12,11,13,13,14,15,16,18], '실내 건조 냄새':[5,6,6,7,7,8,9,10,11,13,15,18], '전기요금':[12,13,11,12,10,11,10,9,10,9,10,9], '구김':[6,7,6,7,8,7,8,8,7,8,9,9], '설치 공간':[5,5,6,5,6,6,5,6,6,7,6,6], '소음':[5,4,5,5,4,5,4,4,5,4,4,4] },
  kcol:['#4b2ff0','#e0663f','#7cc0d0','#6a4fd6','#2f9e63','#c39a22']
};
VIEWS.trend = { title:'추이', render(){
  const b = TREND.base, tot = WEEKS.map((_,i) => b.POSITIVE[i] + b.NEUTRAL[i] + b.NEGATIVE[i]), negr = WEEKS.map((_,i) => b.NEGATIVE[i] / tot[i]);
  const ss = Object.keys(b).filter(k => ST.trendS.has(k)), kws = Object.keys(TREND.kw), ks = kws.filter(k => ST.trendK.has(k));
  const growth = kws.map(k => [k, TREND.kw[k].at(-1) / TREND.kw[k][0]]).sort((a,c) => c[1] - a[1])[0];
  return `<div class="grid">
    <div class="grid g4">
      <section class="card pad stat"><div class="muted">이번 주 VoC</div><div class="n">${fmt(tot.at(-1))}건</div><div class="d up">▲ 전주 대비 ${tot.at(-1) - tot.at(-2)}건</div></section>
      <section class="card pad stat"><div class="muted">12주 누적</div><div class="n">${fmt(tot.reduce((a,c) => a + c, 0))}건</div><div class="d muted">${WEEKS[0]} – ${WEEKS.at(-1)}</div></section>
      <section class="card pad stat"><div class="muted">부정 비율</div><div class="n">${Math.round(negr.at(-1)*100)}%</div><div class="d up">▲ 12주 전 ${Math.round(negr[0]*100)}%</div></section>
      <section class="card pad stat"><div class="muted">가장 빠르게 증가</div><div class="n" style="font-size:24px">${growth[0]}</div><div class="d up">▲ 12주 동안 ${growth[1].toFixed(1)}배</div></section>
    </div>
    <section class="card pad">
      <div class="row-between"><div><h2>주간 VoC 수집량</h2><div class="sub">감성별 · 주 단위</div></div>
        <div class="tabs">${Object.keys(b).map(k => `<button class="${ST.trendS.has(k)?'on':''}" onclick="toggleSet(ST.trendS,'${k}')">${SENT[k]}</button>`).join('')}</div></div>
      <div style="margin-top:16px">${ss.length ? lineChart(ss.map(k => ({ name:SENT[k], color:SLINE[k], data:b[k] })), WEEKS, { h:280 }) : '<div class="empty">감성을 하나 이상 선택하세요</div>'}</div>
      <div style="margin-top:8px">${legend(ss.map(k => [SENT[k], SLINE[k]]))}</div>
    </section>
    <section class="card pad">
      <h2>불만 키워드 추이</h2><div class="sub">주간 언급 수 · 키워드를 눌러 비교</div>
      <div class="chips" style="margin-top:14px">${kws.map((k,i) => `<button class="chip" style="padding:6px 12px;font-size:13px;${ST.trendK.has(k) ? `background:${TREND.kcol[i]};color:#fff` : ''}" onclick="toggleSet(ST.trendK,'${k}')">${k}</button>`).join('')}</div>
      <div style="margin-top:16px">${ks.length ? lineChart(ks.map(k => ({ name:k, color:TREND.kcol[kws.indexOf(k)], data:TREND.kw[k] })), WEEKS, { h:260 }) : '<div class="empty">키워드를 하나 이상 선택하세요</div>'}</div>
    </section>
  </div>`;
} };
function toggleSet(set, k){ set.has(k) ? set.delete(k) : set.add(k); render(); }

function analyzeVideo(){
  const u = $('#yturl').value.trim();
  if (!/^https?:\/\/(www\.|m\.)?(youtube\.com|youtu\.be)\//.test(u)) { toast('YouTube 영상 주소를 입력하세요'); return; }
  toast('[시뮬레이션] Gemini Flash 영상 분석 요청 · ' + u);
}

/* ==================================================================
 * 5. 라우팅
 * ================================================================== */
function current(){ const v = location.hash.replace(/^#\/?/, ''); return VIEWS[v] ? v : 'dashboard'; }
function go(v){ if (current() === v && location.hash) render(); else location.hash = '#/' + v; }
function render(){
  const v = current(), view = VIEWS[v], same = render.last === v, y = window.scrollY;
  if (!same) closeAll();
  document.querySelectorAll('.rail [data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  $('#title').innerHTML = `Global VoC Lab<small>${view.title} · 트롬 워시콤보 · 폴란드</small>`;
  $('#view').innerHTML = view.render();
  if (view.after) view.after();
  window.scrollTo(0, same ? y : 0);
  render.last = v;
}
document.querySelectorAll('.rail [data-v]').forEach(b => b.addEventListener('click', () => go(b.dataset.v)));
window.addEventListener('hashchange', render);
render();
</script>
